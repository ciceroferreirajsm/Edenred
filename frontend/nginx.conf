server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Encaminha as chamadas da SPA para o container da API (mesma origem, sem CORS).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Fallback de rotas do Angular
  location / {
    try_files $uri $uri/ /index.html;
  }
}
