<header class="page-header">
  <div>
    <a class="back" routerLink="/pessoas">‹ Pessoas</a>
    <h1>{{ editando ? 'Editar pessoa' : 'Nova pessoa' }}</h1>
  </div>
</header>

<section class="card">
  @if (carregando()) {
    <p class="muted center">Carregando…</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
      <div class="grid">
        <label class="field span-2">
          <span>Nome completo *</span>
          <input class="input" formControlName="nome" autocomplete="name" maxlength="150" />
          <app-field-error [control]="form.controls.nome" />
        </label>

        <label class="field">
          <span>CPF *</span>
          <input class="input mono" formControlName="cpf" appMask="cpf" placeholder="000.000.000-00" inputmode="numeric" />
          <app-field-error [control]="form.controls.cpf" />
        </label>

        <label class="field">
          <span>Data de nascimento *</span>
          <input class="input" type="date" formControlName="dataNascimento" />
          <app-field-error [control]="form.controls.dataNascimento" />
        </label>

        <label class="field">
          <span>E-mail *</span>
          <input class="input" type="email" formControlName="email" autocomplete="email" placeholder="nome@dominio.com" />
          <app-field-error [control]="form.controls.email" />
        </label>

        <label class="field">
          <span>Telefone</span>
          <input class="input" formControlName="telefone" appMask="telefone" placeholder="(00) 00000-0000" inputmode="tel" />
          <app-field-error [control]="form.controls.telefone" />
        </label>
      </div>

      <div class="form-actions">
        <a class="btn" routerLink="/pessoas">Cancelar</a>
        <button type="submit" class="btn btn-primary" [disabled]="salvando()">
          {{ salvando() ? 'Salvando…' : 'Salvar' }}
        </button>
      </div>
    </form>
  }
</section>
